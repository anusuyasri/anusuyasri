<svg width="100%" viewBox="0 0 830 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Anusuya Srivastava — Full Stack Developer | AI/ML Explorer</title>
  <desc>Animated banner with dark background, grid lines, and scan effect</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=JetBrains+Mono:wght@400&amp;display=swap');
      .name { font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .sub  { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #a78bfa; letter-spacing: 2px; }
      .grid { stroke: #1e2a3a; stroke-width: 0.5; }
      .scan { animation: scanMove 3s linear infinite; }
      @keyframes scanMove {
        0%   { transform: translateX(-830px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateX(830px); opacity: 0; }
      }
      .dot  { fill: #7c3aed; animation: pulse 2s ease-in-out infinite; }
      .dot2 { fill: #a78bfa; animation: pulse 2s ease-in-out infinite 0.4s; }
      .dot3 { fill: #6d28d9; animation: pulse 2s ease-in-out infinite 0.8s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; r: 2; }
        50%       { opacity: 1;   r: 3; }
      }
      .fade-in       { animation: fadeIn 1.2s ease forwards; }
      .fade-in-delay { animation: fadeIn 1.2s ease 0.4s both; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .bracket     { fill: none; stroke: #7c3aed; stroke-width: 1.5; opacity: 0.6; }
      .accent-line { stroke: #7c3aed; stroke-width: 1; opacity: 0.4; }
    </style>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0e1a"/>
      <stop offset="60%"  stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f0c1e"/>
    </linearGradient>

    <clipPath id="bannerClip">
      <rect width="830" height="160" rx="0"/>
    </clipPath>
  </defs>

  <rect width="830" height="160" fill="url(#bgGrad)"/>

  <g clip-path="url(#bannerClip)">
    <line x1="83"  y1="0" x2="83"  y2="160" class="grid"/>
    <line x1="166" y1="0" x2="166" y2="160" class="grid"/>
    <line x1="249" y1="0" x2="249" y2="160" class="grid"/>
    <line x1="332" y1="0" x2="332" y2="160" class="grid"/>
    <line x1="415" y1="0" x2="415" y2="160" class="grid"/>
    <line x1="498" y1="0" x2="498" y2="160" class="grid"/>
    <line x1="581" y1="0" x2="581" y2="160" class="grid"/>
    <line x1="664" y1="0" x2="664" y2="160" class="grid"/>
    <line x1="747" y1="0" x2="747" y2="160" class="grid"/>
    <line x1="0" y1="40"  x2="830" y2="40"  class="grid"/>
    <line x1="0" y1="80"  x2="830" y2="80"  class="grid"/>
    <line x1="0" y1="120" x2="830" y2="120" class="grid"/>

    <g class="scan">
      <rect x="-60" y="0" width="120" height="160" fill="url(#scanGrad)"/>
    </g>

    <path d="M 28 18 L 18 18 L 18 38" class="bracket"/>
    <path d="M 802 18 L 812 18 L 812 38" class="bracket"/>
    <path d="M 28 142 L 18 142 L 18 122" class="bracket"/>
    <path d="M 802 142 L 812 142 L 812 122" class="bracket"/>

    <circle cx="44" cy="80" r="2" class="dot"/>
    <circle cx="52" cy="80" r="2" class="dot2"/>
    <circle cx="60" cy="80" r="2" class="dot3"/>
    <circle cx="786" cy="80" r="2" class="dot3"/>
    <circle cx="778" cy="80" r="2" class="dot2"/>
    <circle cx="770" cy="80" r="2" class="dot"/>

    <line x1="72" y1="60" x2="72" y2="100" class="accent-line"/>

    <text x="415" y="88" text-anchor="middle" class="name fade-in">Anusuya Srivastava</text>
    <text x="415" y="120" text-anchor="middle" class="sub fade-in-delay">&lt; Full Stack Developer · AI/ML Explorer /&gt;</text>
  </g>
</svg>
